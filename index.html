<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social intelligence</title>
    <!-- d06 (21 Oct): a neutral icon (white-label, no brand mark) so the browser stops asking for
         /favicon.ico and logging a 404. A grey tile with a rising line, inline so no file is needed. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23475467'/%3E%3Cpath d='M8 21l5-5 4 3 7-8' fill='none' stroke='%23fff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- HighRise's font stack asks for "Inter var". Google's file registers the family as
         "Inter", so it never matched and every screen fell back to the system font. -->
    <link rel="preconnect" href="https://rsms.me/" />
    <link href="https://rsms.me/inter/inter.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
